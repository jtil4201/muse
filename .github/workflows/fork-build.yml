name: Build fork image

# Builds jtil4201's customized Muse into ghcr.io/jtil4201/muse.
# Bundles the latest yt-dlp on every build so YouTube playback stays reliable.

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: fork-build
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/jtil4201/muse

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Resolve yt-dlp version + metadata
        id: meta
        run: |
          set -euo pipefail
          yt="$(curl -fsSL https://pypi.org/pypi/yt-dlp/json | jq -r '.info.version')"
          [ -n "$yt" ] && [ "$yt" != "null" ] || { echo "could not resolve yt-dlp"; exit 1; }
          echo "ytdlp=$yt" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
          build-args: |
            YT_DLP_VERSION=${{ steps.meta.outputs.ytdlp }}
            COMMIT_HASH=${{ steps.meta.outputs.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/jtil4201/muse
            org.opencontainers.image.description=Muse (garftheholy fork) with yt-dlp ${{ steps.meta.outputs.ytdlp }}
